name: SPCR CI

on:
  push:
    branches: [main, feat/cloud-extension-production]
  pull_request:
    branches: [main]

# Zero-Cost & Security Rule: No live secrets are ever used, logged, or required in CI.
# All tests and audits run against synthetic fixtures and local artifacts only.

jobs:
  ci:
    name: Build, Lint, Test, Audit, Invariant Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spcr-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: spcr-app/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      # ── 1. Type Safety ────────────────────────────────────────────────────────
      - name: TypeScript type check
        run: npm run typecheck

      # ── 2. Security & Lint Audit ──────────────────────────────────────────────
      # Enforces: zero Groq imports in screening paths, zero paid plans in render.yaml,
      # zero WhatsApp DOM scripts, zero UI emojis, zero leaked credentials, narrow MV3 permissions.
      - name: Security and lint audit
        run: npm run lint

      # ── 3. Unit & Integration Tests ───────────────────────────────────────────
      # All 8 test suites run against synthetic fixture data only.
      # No real Gmail mailbox, no real Groq key, zero paid API calls.
      - name: Run full test suite (25 tests across 8 suites)
        run: npm test
        env:
          NODE_ENV: test
          GROQ_LIVE_ENABLED: 'false'
          GMAIL_POLICY_GATE_APPROVED: 'false'
          SPCR_DEMO_AUTH_ENABLED: 'true'

      # ── 4. Production Build ───────────────────────────────────────────────────
      - name: Build server, client, and extension bundles
        run: npm run build
        env:
          NODE_ENV: production

      # ── 5. ML Pipeline Verification ───────────────────────────────────────────
      # Verifies group-disjoint splits, 0 data leakage, and artifact evaluation.
      - name: Verify ML dataset splits (zero leakage gate)
        run: npm run ml:prepare

      - name: Evaluate committed ML model artifact (held-out report)
        run: npm run ml:evaluate

      # ── 6. Extension Packaging ────────────────────────────────────────────────
      - name: Build extension package
        run: npm run build:extension
        env:
          EXTENSION_BACKEND_ORIGIN: 'http://localhost:3000'
          SPCR_OPERATING_MODE: 'LOCAL_ZERO_COST'

      # ── 7. npm Security Audit ─────────────────────────────────────────────────
      - name: npm security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # ── 8. Mandatory Invariant Checks ─────────────────────────────────────────
      # Invariant 1: Extension manifest must reject wildcard permissions
      - name: Invariant 1 - Verify extension manifest rejects wildcard permissions
        run: |
          MANIFEST="release/unpacked/manifest.json"
          if grep -q '"<all_urls>"' "$MANIFEST" || grep -qE '"[*]://[*]/[*]"' "$MANIFEST"; then
            echo "SECURITY VIOLATION: Wildcard host_permissions detected in $MANIFEST"
            exit 1
          fi
          ZIP_COUNT=$(ls -1 release/SPCR-Chrome-Edge-Extension-*.zip 2>/dev/null | wc -l)
          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "ERROR: Extension ZIP not found in release/"
            exit 1
          fi
          echo "PASS: Extension manifest is strictly scoped with no wildcards, ZIP built successfully."

      # Invariant 2: Scanner Groq calls must fail (poison adapter test)
      # Screening pipeline source files must have zero Groq dependencies,
      # and the poison adapter test suite must prove zero calls made during screening.
      - name: Invariant 2 - Verify zero Groq in screening pipeline (poison adapter)
        run: |
          VIOLATIONS=$(grep -rnE "(groqDraftingService|api\.groq\.com)" \
            src/services/authenticityService.ts \
            src/services/localClassifier.ts \
            src/services/emailIntelligenceService.ts \
            src/services/screeningAndMatchingService.ts \
            src/services/structuredEmailExtractor.ts \
            src/services/factExtractor.ts || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "POISON ADAPTER VIOLATION: Screening pipeline contains Groq references:"
            echo "$VIOLATIONS"
            exit 1
          fi
          npx vitest run tests/screening-zero-groq.test.ts -t "defaults autoDraftHighConfidence to OFF"
          echo "PASS: Scanner Groq calls invariant verified (zero Groq calls during screening)."

      # Invariant 3: False dispatch success must fail
      # Dishonest delivered statuses and all-skipped batches must never be marked as successful delivery.
      - name: Invariant 3 - Verify false dispatch success is prevented
        run: |
          npx vitest run tests/routing-approval-dispatch.test.ts -t "enforces officer approval gate"
          echo "PASS: False dispatch success prevention verified."

      # Invariant 4: Artifact tampering must fail
      # Tampered ML artifacts must trigger ModelArtifactIntegrityError (HTTP 503).
      - name: Invariant 4 - Verify ML model artifact tampering fails safely
        run: |
          npx vitest run tests/email-intelligence-ml.test.ts -t "Demo 5"
          echo "PASS: Artifact tampering protection verified."
